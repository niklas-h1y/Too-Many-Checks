name: Archive and binary integrity

on:
  push:
    paths: ["**/*.zip", "**/*.jar", "**/*.war", "**/*.ear", "**/*.aar", "**/*.tar", "**/*.tar.gz", "**/*.tgz", "**/*.gz"]
  pull_request:
    paths: ["**/*.zip", "**/*.jar", "**/*.war", "**/*.ear", "**/*.aar", "**/*.tar", "**/*.tar.gz", "**/*.tgz", "**/*.gz"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-archives:
    name: Archive integrity and path-safety audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect archive structure and safety
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          ignored = {".git", ".venv", "node_modules"}
          archives = [
              p for p in pathlib.Path(".").rglob("*")
              if p.is_file()
              and not ignored.intersection(p.parts)
              and p.suffix.lower() in {".zip", ".jar", ".war", ".ear", ".aar", ".tar", ".gz", ".tgz"}
          ]
          if not archives:
              print("No supported archives found; archive checks are skipped.")
          for path in archives:
              print(f"Checking {path}")
              if zipfile.is_zipfile(path):
                  with zipfile.ZipFile(path) as archive:
                      bad = archive.testzip()
                      if bad:
                          raise SystemExit(f"{path}: corrupt member {bad}")
                      names = [item.filename for item in archive.infolist()]
                      if len(names) != len(set(names)):
                          raise SystemExit(f"{path}: duplicate member names detected")
                      for name in names:
                          candidate = pathlib.PurePosixPath(name)
                          if candidate.is_absolute() or ".." in candidate.parts:
                              raise SystemExit(f"{path}: unsafe member path {name!r}")
                      total = sum(item.file_size for item in archive.infolist())
                      compressed = max(path.stat().st_size, 1)
                      if total > 2 * 1024**3 or total / compressed > 1000:
                          raise SystemExit(f"{path}: suspicious expansion ratio or uncompressed size")
              elif tarfile.is_tarfile(path):
                  with tarfile.open(path, "r:*") as archive:
                      for member in archive.getmembers():
                          candidate = pathlib.PurePosixPath(member.name)
                          if candidate.is_absolute() or ".." in candidate.parts:
                              raise SystemExit(f"{path}: unsafe member path {member.name!r}")
                          if member.issym() or member.islnk():
                              target = pathlib.PurePosixPath(member.linkname)
                              if target.is_absolute() or ".." in target.parts:
                                  raise SystemExit(f"{path}: unsafe link target {member.linkname!r}")
              elif path.suffix.lower() == ".gz":
                  import gzip
                  with gzip.open(path, "rb") as stream:
                      while stream.read(1024 * 1024):
                          pass
              else:
                  raise SystemExit(f"{path}: unsupported or malformed archive")
              print(f"PASS {path}")
          PY
