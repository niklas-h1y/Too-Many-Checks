name: Release artifacts and provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package source and attest artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=Too-Many-Checks/ HEAD > dist/source.tar.gz
          git archive --format=zip --prefix=Too-Many-Checks/ HEAD > dist/source.zip
          cd dist
          sha256sum source.tar.gz source.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/source.tar.gz \
            dist/source.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --verify-tag
