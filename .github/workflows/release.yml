name: Release artifacts and provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package source and attest artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=Too-Many-Checks/ HEAD > dist/source.tar.gz
          git archive --format=zip --prefix=Too-Many-Checks/ HEAD > dist/source.zip
          cd dist
          sha256sum source.tar.gz source.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/source.tar.gz
            dist/source.zip
            dist/SHA256SUMS
          generate_release_notes: true
