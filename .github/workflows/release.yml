name: Release artifacts and provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package source and attest artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=Too-Many-Checks/ HEAD > dist/source.tar.gz
          git archive --format=zip --prefix=Too-Many-Checks/ HEAD > dist/source.zip
          cd dist
          sha256sum source.tar.gz source.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/source.tar.gz \
            dist/source.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --verify-tag
