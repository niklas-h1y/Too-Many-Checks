name: Release artifacts and provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package source and attest artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=Too-Many-Checks/ HEAD > dist/source.tar.gz
          git archive --format=zip --prefix=Too-Many-Checks/ HEAD > dist/source.zip
          cd dist
          sha256sum source.tar.gz source.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # pinned
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # pinned
        with:
          files: |
            dist/source.tar.gz
            dist/source.zip
            dist/SHA256SUMS
          generate_release_notes: true
