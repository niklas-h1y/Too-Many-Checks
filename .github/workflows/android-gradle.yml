name: Android Gradle validation

on:
  push:
    branches: [main]
    paths: ["**/gradlew", "**/*.gradle", "**/*.gradle.kts", "**/gradle.properties"]
  pull_request:
    paths: ["**/gradlew", "**/*.gradle", "**/*.gradle.kts", "**/gradle.properties"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android Gradle lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Detect Android Gradle project
        id: gradle
        shell: bash
        run: |
          find . -type f -name gradlew -not -path './.git/*' -print > gradle-wrappers.txt
          grep -RIlE 'com\.android\.(application|library)' --include='*.gradle' --include='*.gradle.kts' . > android-gradle-files.txt || true
          if [ -s gradle-wrappers.txt ] && [ -s android-gradle-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Android Gradle project found; Android build checks are skipped."
          fi
      - name: Set up Java
        if: steps.gradle.outputs.found == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # pinned
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        if: steps.gradle.outputs.found == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # pinned
      - name: Run Android lint and unit tests
        if: steps.gradle.outputs.found == 'true'
        shell: bash
        run: |
          while IFS= read -r wrapper; do
            project_dir="$(dirname "$wrapper")"
            chmod +x "$wrapper"
            (cd "$project_dir" && ./gradlew --no-daemon lint test)
          done < gradle-wrappers.txt
