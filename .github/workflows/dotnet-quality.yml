name: .NET build, test and package security

on:
  push:
    paths: ["**/*.cs","**/*.csproj","**/*.sln","**/*.slnx","**/Directory.Packages.props","**/packages.lock.json"]
  pull_request:
    paths: ["**/*.cs","**/*.csproj","**/*.sln","**/*.slnx","**/Directory.Packages.props","**/packages.lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: .NET restore, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate solution or project
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.slnx') != '' || hashFiles('**/*.csproj') != ''
        id: project
        shell: bash
        run: |
          target="$(find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) -not -path '*/obj/*' -print -quit)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.slnx') != '' || hashFiles('**/*.csproj') != ''
        env:
          PROJECT_FILE: ${{ steps.project.outputs.target }}
        run: dotnet restore "$PROJECT_FILE"
      - name: Build with warnings as errors
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.slnx') != '' || hashFiles('**/*.csproj') != ''
        env:
          PROJECT_FILE: ${{ steps.project.outputs.target }}
        run: dotnet build "$PROJECT_FILE" --no-restore --configuration Release -warnaserror
      - name: Run tests when test projects exist
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.slnx') != '' || hashFiles('**/*.csproj') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet test "$project" --configuration Release --no-restore
          done < <(find . -type f -iname '*test*.csproj' -not -path '*/obj/*' -print0)

  format:
    name: dotnet format whitespace and analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate solution or project
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.csproj') != ''
        id: project
        shell: bash
        run: |
          target="$(find . -type f \( -name '*.sln' -o -name '*.csproj' \) -not -path '*/obj/*' -print -quit)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - run: dotnet restore "${{ steps.project.outputs.target }}"
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.csproj') != ''
      - run: dotnet format "${{ steps.project.outputs.target }}" --verify-no-changes --no-restore
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.csproj') != ''

  vulnerable-packages:
    name: NuGet vulnerable dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit NuGet dependencies
        if: hashFiles('**/*.csproj') != '' || hashFiles('**/packages.lock.json') != ''
        run: |
          while IFS= read -r -d '' project; do
            dotnet list "$project" package --vulnerable --include-transitive
          done < <(find . -type f -name '*.csproj' -not -path '*/obj/*' -print0)
