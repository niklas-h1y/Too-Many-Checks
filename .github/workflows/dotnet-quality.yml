name: .NET build, test and package security

on:
  push:
    paths: ["**/*.cs","**/*.csproj","**/*.sln","**/*.slnx","**/Directory.Packages.props","**/packages.lock.json"]
  pull_request:
    paths: ["**/*.cs","**/*.csproj","**/*.sln","**/*.slnx","**/Directory.Packages.props","**/packages.lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: .NET restore, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore and build every solution or project
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.slnx') != '' || hashFiles('**/*.csproj') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet restore "$project"
            dotnet build "$project" --no-restore --configuration Release -warnaserror
          done < <(find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) -not -path '*/obj/*' -print0)
      - name: Run all test projects
        if: hashFiles('**/*test*.csproj') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet test "$project" --configuration Release
          done < <(find . -type f -iname '*test*.csproj' -not -path '*/obj/*' -print0)

  format:
    name: dotnet format whitespace and analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore and verify formatting for every solution or project
        if: hashFiles('**/*.sln') != '' || hashFiles('**/*.csproj') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet restore "$project"
            dotnet format "$project" --verify-no-changes --no-restore
          done < <(find . -type f \( -name '*.sln' -o -name '*.csproj' \) -not -path '*/obj/*' -print0)

  vulnerable-packages:
    name: NuGet vulnerable dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit NuGet dependencies
        if: hashFiles('**/*.csproj') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet restore "$project"
            dotnet list "$project" package --vulnerable --include-transitive
          done < <(find . -type f -name '*.csproj' -not -path '*/obj/*' -print0)
