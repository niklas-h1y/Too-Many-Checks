name: Go quality and vulnerability checks

on:
  push:
    paths: ["**/*.go","**/go.mod","**/go.sum"]
  pull_request:
    paths: ["**/*.go","**/go.mod","**/go.sum"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-race-tests:
    name: Go tests and race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests in each Go module
        if: hashFiles('**/go.mod') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            (cd "$(dirname "$module")" && go test ./...)
          done < <(find . -type f -name go.mod -not -path '*/vendor/*' -print0)
      - name: Run race-enabled tests in each Go module
        if: hashFiles('**/go.mod') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            (cd "$(dirname "$module")" && go test -race ./...)
          done < <(find . -type f -name go.mod -not -path '*/vendor/*' -print0)

  compiler-vet:
    name: Go vet static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run go vet in every Go module
        if: hashFiles('**/go.mod') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            (cd "$(dirname "$module")" && go vet ./...)
          done < <(find . -type f -name go.mod -not -path '*/vendor/*' -print0)

  vulnerability-analysis:
    name: govulncheck call-graph analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze reachable Go vulnerabilities
        if: hashFiles('**/go.mod') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            (cd "$(dirname "$module")" && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)
          done < <(find . -type f -name go.mod -not -path '*/vendor/*' -print0)
