name: Ruby and PHP quality checks

on:
  push:
    paths: ["**/*.rb","**/Gemfile","**/Gemfile.lock","**/*.php","**/composer.json","**/composer.lock"]
  pull_request:
    paths: ["**/*.rb","**/Gemfile","**/Gemfile.lock","**/*.php","**/composer.json","**/composer.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-style:
    name: RuboCop Ruby style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.263.0
        if: hashFiles('**/*.rb') != ''
        with:
          ruby-version: "3.3"
      - run: gem install rubocop --no-document --version 1.81.1
        if: hashFiles('**/*.rb') != ''
      - run: rubocop --format progress
        if: hashFiles('**/*.rb') != ''

  ruby-dependencies:
    name: Bundler dependency and lockfile audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.263.0
        if: hashFiles('**/Gemfile') != ''
        with:
          ruby-version: "3.3"
      - run: gem install bundler-audit --no-document --version 0.9.2
        if: hashFiles('**/Gemfile') != ''
      - run: bundle-audit check --update
        if: hashFiles('**/Gemfile') != ''

  php-composer:
    name: Composer validation and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate composer manifests
        if: hashFiles('**/composer.json') != ''
        shell: bash
        run: |
          while IFS= read -r -d '' manifest; do
            composer validate --strict --no-check-publish "$manifest"
            composer audit --locked --no-interaction --working-dir "$(dirname "$manifest")"
          done < <(find . -type f -name composer.json -not -path '*/vendor/*' -print0)

  php-static:
    name: PHP syntax and PHPStan analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint PHP syntax
        if: hashFiles('**/*.php') != ''
        run: |
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path '*/vendor/*' -print0)
