name: Documentation link check

on:
  push:
    branches: [main]
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned
        with:
          persist-credentials: false
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # pinned
        with:
          args: --verbose --no-progress --hidden --accept 200,206,429 --max-retries 3 --timeout 20 .
          fail: true
