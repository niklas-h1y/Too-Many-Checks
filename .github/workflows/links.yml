name: Documentation link check

on:
  push:
    branches: [main]
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress --exclude-mail --accept 200,206,429 --max-retries 3 --timeout 20 '**/*.md'
          fail: true
