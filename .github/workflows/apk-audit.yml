name: Android APK audit

on:
  push:
    paths: ["**/*.apk"]
  pull_request:
    paths: ["**/*.apk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-audit:
    name: APK static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find APK artifacts
        id: find
        shell: bash
        run: |
          find . -type f -iname '*.apk' -not -path './.git/*' -print > apk-files.txt
          if [ -s apk-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No APK files in this revision; Android-specific checks are skipped."
          fi
      - name: Set up Android SDK
        if: steps.find.outputs.found == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build tools
        if: steps.find.outputs.found == 'true'
        run: sdkmanager "build-tools;35.0.0"
      - name: Set up Java for APK decompilation
        if: steps.find.outputs.found == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JADX decompiler
        if: steps.find.outputs.found == 'true'
        run: |
          curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Install APK static-analysis tools
        if: steps.find.outputs.found == 'true'
        run: python -m pip install --disable-pip-version-check apkid apkleaks
      - name: Inspect APK structure, manifest, signing and alignment
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p apk-audit-reports
          while IFS= read -r apk; do
            name="$(basename "$apk" .apk)"
            report="apk-audit-reports/$name.txt"
            {
              echo "=== FILE: $apk ==="
              sha256sum "$apk"
              unzip -t "$apk"
              echo "=== PACKAGE SUMMARY ==="
              apkanalyzer apk summary "$apk"
              echo "=== APPLICATION ID ==="
              apkanalyzer manifest application-id "$apk"
              echo "=== SDK LEVELS ==="
              apkanalyzer manifest min-sdk "$apk"
              apkanalyzer manifest target-sdk "$apk"
              echo "=== DECLARED PERMISSIONS ==="
              apkanalyzer manifest permissions "$apk"
              echo "=== DEX FILE INVENTORY ==="
              apkanalyzer dex list "$apk"
              echo "=== APK FILE INVENTORY ==="
              apkanalyzer files list "$apk"
              echo "=== SIGNATURE SCHEMES AND CERTIFICATE ==="
              apksigner verify --verbose --print-certs "$apk"
              echo "=== ZIP ALIGNMENT ==="
              zipalign -c -v 4 "$apk"
              echo "=== MANIFEST SECURITY REVIEW ==="
              apkanalyzer manifest print "$apk" > "apk-audit-reports/$name-manifest.xml"
              python - "apk-audit-reports/$name-manifest.xml" "$apk" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path, apk_path = sys.argv[1:]
          root = ET.parse(manifest_path).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit(f"{apk_path}: manifest has no application element")
          if app.get(android + "debuggable") == "true":
              raise SystemExit(f"::error file={apk_path}::APK is marked debuggable")
          if app.get(android + "usesCleartextTraffic") == "true":
              print(f"::warning file={apk_path}::Cleartext network traffic is explicitly enabled")
          if app.get(android + "allowBackup") == "true":
              print(f"::warning file={apk_path}::Application data backup is enabled; review backup rules")
          if app.get(android + "testOnly") == "true":
              print(f"::warning file={apk_path}::APK is marked testOnly")
          exported_without_permission = []
          for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
              for component in app.findall(tag):
                  if component.get(android + "exported") == "true" and not component.get(android + "permission"):
                      exported_without_permission.append((tag, component.get(android + "name", "<unnamed>")))
          for kind, component_name in exported_without_permission:
              print(f"::warning file={apk_path}::Exported {kind} has no component-level permission: {component_name}")
          if exported_without_permission:
              print(f"Review {len(exported_without_permission)} exported component(s) for unintended external access.")
          PY
            } | tee "$report"
            echo "=== APKID PACKER / COMPILER SCAN ===" | tee -a "$report"
            apkid "$apk" 2>&1 | tee -a "$report"
            echo "=== APKLEAKS HARDCODED-SECRET SCAN ===" | tee -a "$report"
            apkleaks -f "$apk" --json -o "apk-audit-reports/$name-apkleaks.json" 2>&1 | tee -a "$report"
            python - "apk-audit-reports/$name-apkleaks.json" "$apk" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report_data = json.load(report_file)
          findings = report_data.get("results", [])
          if findings:
              print(f"::error file={sys.argv[2]}::APKLeaks found {len(findings)} potential hard-coded secret pattern(s)")
              for finding in findings:
                  print(finding.get("name", "Unspecified secret pattern"))
              raise SystemExit(1)
          print("APKLeaks found no hard-coded secret patterns.")
          PY
          done < apk-files.txt
      - name: Decompile DEX and flag risky Android API patterns
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p apk-audit-reports/decompiled
          while IFS= read -r apk; do
            name="$(basename "$apk" .apk)"
            jadx --no-res --no-imports --threads-count 2 -d "apk-audit-reports/decompiled/$name" "$apk" || {
              echo "::warning file=$apk::JADX could not fully decompile this APK; inspect the APKID/APKLeaks reports."
              continue
            }
          done < apk-files.txt
          python - <<'PY'
          import pathlib
          import re

          rules = {
              "WebView JavaScript bridge": r"addJavascriptInterface\s*\(",
              "WebView JavaScript enabled": r"setJavaScriptEnabled\s*\(\s*true",
              "TLS certificate validation bypass": r"onReceivedSslError|proceed\s*\(",
              "Trust-all certificate manager": r"X509TrustManager|ALLOW_ALL_HOSTNAME_VERIFIER",
              "Insecure ECB cipher mode": r"Cipher\.getInstance\s*\(\s*['"]AES/ECB",
              "World-readable file mode": r"MODE_WORLD_READABLE|MODE_WORLD_WRITEABLE",
              "Plain HTTP URL": r"http://[^\s]+",
          }
          root = pathlib.Path("apk-audit-reports/decompiled")
          counts = {name: 0 for name in rules}
          for source in root.rglob("*.java"):
              text = source.read_text(encoding="utf-8", errors="replace")
              for label, pattern in rules.items():
                  hits = list(re.finditer(pattern, text, re.IGNORECASE))
                  counts[label] += len(hits)
                  for hit in hits[:10]:
                      line = text.count("\n", 0, hit.start()) + 1
                      print(f"::warning file={source},line={line}::{label} pattern detected (review context)")
          pathlib.Path("apk-audit-reports/api-pattern-summary.txt").write_text(
              "\n".join(f"{label}: {count}" for label, count in counts.items()) + "\n",
              encoding="utf-8",
          )
          print("API pattern scan is heuristic; warnings require manual review.")
          PY
      - name: Upload APK audit reports
        if: always() && steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-audit
          path: apk-audit-reports/
          if-no-files-found: warn
          retention-days: 30
