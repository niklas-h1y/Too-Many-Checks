name: Android App Bundle audit

on:
  push:
    paths: ["**/*.aab"]
  pull_request:
    paths: ["**/*.aab"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-audit:
    name: AAB structure, manifest and signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Android App Bundles
        id: find
        shell: bash
        run: |
          find . -type f -iname '*.aab' -not -path './.git/*' -print > aab-files.txt
          if [ -s aab-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No AAB files found; Android App Bundle checks are skipped."
          fi
      - name: Set up Java
        if: steps.find.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bundletool
        if: steps.find.outputs.found == 'true'
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
      - name: Validate AAB structure, modules, manifest and signature
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p aab-audit-reports
          while IFS= read -r bundle; do
            name="$(basename "$bundle" .aab)"
            report="aab-audit-reports/$name.txt"
            {
              echo "=== FILE: $bundle ==="
              sha256sum "$bundle"
              unzip -t "$bundle"
              echo "=== BUNDLETOOL VALIDATION ==="
              java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
              echo "=== BASE MODULE MANIFEST ==="
              java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --module=base
              echo "=== JAR SIGNATURE ==="
              jarsigner -verify -verbose -certs "$bundle"
            } | tee "$report"
            if ! grep -q "jar verified." "$report"; then
              echo "::error file=$bundle::AAB is not signed with a verifiable JAR signature"
              exit 1
            fi
          done < aab-files.txt
      - name: Upload AAB audit reports
        if: always() && steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle-audit
          path: aab-audit-reports/
          if-no-files-found: warn
          retention-days: 30
