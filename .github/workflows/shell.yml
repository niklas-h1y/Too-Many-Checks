name: Shell quality

on:
  push:
    branches: [main]
    paths: ["**/*.sh", "**/*.bash"]
  pull_request:
    paths: ["**/*.sh", "**/*.bash"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: ShellCheck and shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned
        with:
          persist-credentials: false
      - name: Find shell scripts
        id: scripts
        shell: bash
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print > shell-files.txt
          if [ -s shell-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No shell scripts found; shell-specific checks are skipped."
          fi
      - name: Install shell analyzers
        if: steps.scripts.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      - name: Run ShellCheck and shfmt
        if: steps.scripts.outputs.found == 'true'
        shell: bash
        run: |
          mapfile -t scripts < shell-files.txt
          shellcheck --severity=style "${scripts[@]}"
          shfmt -d -i 2 "${scripts[@]}"
