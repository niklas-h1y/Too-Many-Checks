name: JSON schema validation

on:
  push:
    paths: ["**/*.json","**/*.schema.json","**/*.jsonc"]
  pull_request:
    paths: ["**/*.json","**/*.schema.json","**/*.jsonc"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-parse:
    name: Strict JSON syntax validation
    if: hashFiles('**/*.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse all JSON files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files = [p for p in Path(".").rglob("*.json") if ".git" not in p.parts and "node_modules" not in p.parts and ".venv" not in p.parts]
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"PASS {path}")
          print(f"Validated {len(files)} JSON file(s).")
          PY

  schema-meta-validation:
    name: JSON Schema meta-schema validation
    if: hashFiles('**/*.schema.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate each schema against its meta-schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from jsonschema.validators import validator_for
          schemas = [p for p in Path(".").rglob("*.schema.json") if ".git" not in p.parts and "node_modules" not in p.parts]
          for path in schemas:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator = validator_for(schema)
              validator.check_schema(schema)
              print(f"PASS {path} ({validator.__name__})")
          PY

  duplicate-json-keys:
    name: Duplicate JSON object key detection
    if: hashFiles('**/*.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject duplicate object keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate key: {key}")
                  result[key] = value
              return result
          files = [p for p in Path(".").rglob("*.json") if ".git" not in p.parts and "node_modules" not in p.parts and ".venv" not in p.parts]
          for path in files:
              json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique)
              print(f"PASS {path}")
          PY
