name: Stale issues and pull requests

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: "This issue has had no activity for 60 days. It will be closed in 14 days if no further activity occurs."
          stale-pr-message: "This pull request has had no activity for 60 days. It will be closed in 14 days if no further activity occurs."
