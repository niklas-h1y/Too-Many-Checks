name: Python quality and supply-chain checks

on:
  push:
    paths: ["**/*.py", "**/pyproject.toml", "**/requirements*.txt", "**/Pipfile*", "**/poetry.lock", "**/uv.lock"]
  pull_request:
    paths: ["**/*.py", "**/pyproject.toml", "**/requirements*.txt", "**/Pipfile*", "**/poetry.lock", "**/uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Python project
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python source files; Python-specific checks are skipped."
          fi

  lint-and-format:
    name: Ruff lint and formatting
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check ruff==0.14.7
      - name: Lint Python source
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  security-and-types:
    name: Bandit security and mypy typing
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check bandit==1.9.2 mypy==1.18.2
      - name: Scan for common Python security issues
        run: bandit -r . -x .git,.venv,venv
      - name: Run static type analysis
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.py' -not -path './.git/*' -not -path './.venv/*' -print0)
          if (("${#files[@]}" > 0)); then
            mypy --ignore-missing-imports "${files[@]}"
          fi

  dependency-audit:
    name: Python dependency vulnerability audit
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit requirements files
        shell: bash
        run: |
          mapfile -t manifests < <(find . -type f \( -name 'requirements*.txt' \) -not -path './.git/*')
          if (("${#manifests[@]}" > 0)); then
            for manifest in "${manifests[@]}"; do pip-audit -r "$manifest"; done
          elif [[ -f pyproject.toml ]]; then
            python -m pip install .
            pip-audit
          else
            echo "No pip requirements manifest found; package vulnerability audit is skipped."
          fi
